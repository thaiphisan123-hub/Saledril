<!DOCTYPE html>
<html>
<head>
    <title>Maafin Aku Ya!</title>
    <style>
        body {
            background-color: #ffeef8;
            text-align: center;
            font-family: sans-serif;
            margin-top: 100px;
        }
        h1 {
            color: #e91e63;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        #btn_mau {
            background-color: #4CAF50;
            color: white;
        }
        #btn_gamau {
            background-color: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>
    <h1>Masih ngambek aja nih? 🥺</h1>
    <p>Aku benar-benar minta maaf ya udah bikin kamu kesal.</p>
    <br>
    
    <div style="position: relative; height: 150px;">
        <button id="btn_mau" onclick="alert('Yeay, makasih udah dimaafin! :D')">Iya, dimaafin</button>
        &nbsp;&nbsp;
        <button id="btn_gamau" onmouseover="pindah(this)" onclick="pindah(this)">Ga</button>
    </div>

    <script>
        function pindah(id) {
            var i = Math.floor(Math.random() * 250) + 50;
            var j = Math.floor(Math.random() * 200) + 20;
            id.style.left = i + "px";
            id.style.top = j + "px";
        }
    </script>
</body>
</html>
